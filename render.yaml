# ===================================================================
# Render Infrastructure Blueprint Configuration (render.yaml)
# Deploy full-stack CampusX (Backend, Frontend, PostgreSQL) on Render
# ===================================================================

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: campusx-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/campusx-backend-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: campusx-postgres
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: campusx-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campusx-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. React Frontend Static Site
  - type: static
    name: campusx-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campusx-backend.onrender.com/api

databases:
  # 3. Managed PostgreSQL Database
  - name: campusx-postgres
    databaseName: campusx_db
    user: campusx
    plan: free

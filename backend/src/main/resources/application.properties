# ===================================================================
# CampusX Placement & Recruitment Platform - Application Configuration
# ===================================================================

# Server Port (Configurable via PORT environment variable for Render / Cloud hosting)
server.port=${PORT:8080}
spring.application.name=campusx-placement-portal

# Active Profile: 'dev' uses in-memory H2 database; 'prod' uses PostgreSQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Common Spring & Jackson settings
spring.jackson.serialization.fail-on-empty-beans=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Security & JWT Configuration (Loaded from Environment Variables)
# -------------------------------------------------------------------
campusx.jwt.secret=${JWT_SECRET:CampusXSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256SecurityStandard2025!}
campusx.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# CORS Configuration (Configurable for deployed React Frontend)
# -------------------------------------------------------------------
campusx.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,*}

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.campusx=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

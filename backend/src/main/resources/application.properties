# ===================================================================
# CampusX Placement & Recruitment Platform - Application Configuration
# ===================================================================

server.port=8080
spring.application.name=campusx-placement-portal

# Active profile: 'dev' uses H2 (PostgreSQL compatibility mode) for instant setup
# Switch to 'postgres' to connect to a live PostgreSQL database
spring.profiles.active=dev
spring.jackson.serialization.fail-on-empty-beans=false

# -------------------------------------------------------------------
# Database Configuration (Default H2 in PostgreSQL Compatibility Mode)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:campusx_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=campusx
spring.datasource.password=campusx_secret

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
# 512-bit secure secret key for HS512 JWT signing
campusx.jwt.secret=CampusXSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256SecurityStandard2025!
campusx.jwt.expiration-ms=86400000

# -------------------------------------------------------------------
# File Upload Configuration (for Resumes / Offer Letters)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.campusx=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
